<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Cadastro de clientes</title>
	<link rel="stylesheet" th:href="@{css/index.css}">
	<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
	<div class="form-container">
		<h2>Cadastrar Usuário</h2>

		<form action="#" th:action="@{/cliente}" th:object="${cliente}" method="post">

			<div class="form-group">
				<label for="nome">Nome:</label>
				<input type="text" id="nome" th:field="*{nome}" />
			</div>

			<div class="form-group">
				<label for="cpf">CPF:</label>
				<input type="text" id="cpf" th:field="*{cpf}"  />
			</div>

			<button type="submit" class="btn-submit">Enviar</button>

		</form>
	</div>
</body>

</html>
